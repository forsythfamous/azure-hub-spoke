version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories: ["/envs/dev"]
    schedule:
      interval: weekly
    ignore:
      # azurerm major versions change resource schemas; upgrade deliberately (see README).
      - dependency-name: hashicorp/azurerm
        update-types: ["version-update:semver-major"]
