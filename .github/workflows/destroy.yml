# Manual teardown, gated by the same `production` environment as apply.
# Part of the deploy -> verify -> destroy routine that keeps cost bounded.
name: destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy dev" to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-state-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.5"
  TF_DIR: envs/dev
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_owner: ${{ vars.TF_VAR_OWNER }}
  TF_VAR_repository: ${{ github.server_url }}/${{ github.repository }}
  TF_VAR_vm_admin_ssh_public_key: ${{ vars.TF_VAR_VM_ADMIN_SSH_PUBLIC_KEY }}
  TF_VAR_budget_contact_emails: ${{ vars.TF_VAR_BUDGET_CONTACT_EMAILS }}
  TF_VAR_enable_firewall: ${{ vars.TF_VAR_ENABLE_FIREWALL || 'false' }}

jobs:
  plan-destroy:
    name: plan destroy (dev)
    if: inputs.confirm == 'destroy dev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      fingerprint: ${{ steps.summary.outputs.fingerprint }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/terraform-init
        with:
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          working-directory: ${{ env.TF_DIR }}
          terraform-version: ${{ env.TF_VERSION }}
          state-resource-group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          state-storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          state-container: ${{ vars.TFSTATE_CONTAINER }}
          state-key: ${{ vars.TFSTATE_KEY }}

      - name: terraform plan -destroy
        id: summary
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -destroy -input=false -lock=false -out=tfplan
          "$GITHUB_WORKSPACE/.github/scripts/plan-summary.sh" tfplan "Destroy plan: dev"
          cat plan-summary.md >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: destroy (dev)
    needs: plan-destroy
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/terraform-init
        with:
          client-id: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          working-directory: ${{ env.TF_DIR }}
          terraform-version: ${{ env.TF_VERSION }}
          state-resource-group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          state-storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          state-container: ${{ vars.TFSTATE_CONTAINER }}
          state-key: ${{ vars.TFSTATE_KEY }}

      - name: re-plan destroy under lock
        id: summary
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -destroy -input=false -lock-timeout=10m -out=tfplan
          "$GITHUB_WORKSPACE/.github/scripts/plan-summary.sh" tfplan "Destroy: dev"

      - name: verify plan matches the approved plan
        env:
          APPROVED: ${{ needs.plan-destroy.outputs.fingerprint }}
          CURRENT: ${{ steps.summary.outputs.fingerprint }}
        run: |
          if [ "$APPROVED" != "$CURRENT" ]; then
            echo "::error::Destroy plan changed since approval. Re-run the workflow."
            exit 1
          fi

      - name: terraform apply (destroy)
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -lock-timeout=10m tfplan
