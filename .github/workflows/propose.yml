# PROPOSE — every pull request gets static checks, a security scan and a
# speculative plan posted back to the PR. Nothing here can change Azure:
# the plan identity is read-only and the plan runs without a state lock.
name: propose

on:
  pull_request:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - ".tflint.hcl"
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: propose-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
  TF_DIR: envs/dev
  TF_IN_AUTOMATION: "true"

jobs:
  static:
    name: fmt / validate / tflint / trivy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # Offline plan tests against a mocked provider (envs/dev/tests).
      - name: terraform test
        working-directory: ${{ env.TF_DIR }}
        run: terraform test

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download rate limit
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      # Installed from the release tarball and verified against a pinned
      # checksum rather than through a third-party action.
      - name: trivy config scan
        run: |
          curl -fsSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum --check --strict
          tar -xzf trivy.tgz trivy
          ./trivy config --exit-code 1 --severity LOW,MEDIUM,HIGH,CRITICAL \
            --skip-dirs .terraform --skip-dirs '**/.terraform' .

  plan:
    name: plan (dev)
    needs: static
    # Fork PRs get no secrets and no OIDC token; static checks still run.
    # Plans need a subscription; until the repository variable AZURE_ENABLED is
    # 'true', pull requests run only the static checks and the mocked tests.
    if: vars.AZURE_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write       # request the GitHub OIDC token
      pull-requests: write  # post the plan comment
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_owner: ${{ vars.TF_VAR_OWNER }}
      TF_VAR_repository: ${{ github.server_url }}/${{ github.repository }}
      TF_VAR_vm_admin_ssh_public_key: ${{ vars.TF_VAR_VM_ADMIN_SSH_PUBLIC_KEY }}
      TF_VAR_budget_contact_emails: ${{ vars.TF_VAR_BUDGET_CONTACT_EMAILS }}
      TF_VAR_enable_firewall: ${{ vars.TF_VAR_ENABLE_FIREWALL || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/terraform-init
        with:
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          working-directory: ${{ env.TF_DIR }}
          terraform-version: ${{ env.TF_VERSION }}
          state-resource-group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          state-storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          state-container: ${{ vars.TFSTATE_CONTAINER }}
          state-key: ${{ vars.TFSTATE_KEY }}

      # -lock=false: a speculative plan never writes state, so the plan
      # identity only needs read access to the state container.
      - name: terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -input=false -lock=false -out=tfplan

      - name: summarise plan
        id: summary
        working-directory: ${{ env.TF_DIR }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/plan-summary.sh" tfplan "Terraform plan: dev"
          cat plan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: post plan to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUMMARY_FILE: ${{ env.TF_DIR }}/plan-summary.md
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.SUMMARY_FILE, 'utf8');
            const marker = body.split('\n')[0];
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
